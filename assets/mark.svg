<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Budget Planner">
  <defs>
    <linearGradient id="ring" x1="6" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3C6E9C"/>
      <stop offset="1" stop-color="#2E97A6"/>
    </linearGradient>
  </defs>
  <!-- open swoosh ring -->
  <path d="M35.5 10.5 A18 18 0 1 0 42 24" fill="none" stroke="url(#ring)" stroke-width="4.4" stroke-linecap="round"/>
  <!-- dollar sign -->
  <text x="20.5" y="30.5" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="19" fill="#1B3A5B" text-anchor="middle">$</text>
  <!-- rising arrow -->
  <path d="M13 33 L21.5 24.5 L27.5 30 L36.5 19" fill="none" stroke="#5DBB46" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40.5 14 L30.5 16.5 L38 23.5 Z" fill="#5DBB46"/>
</svg>
